version: 2
updates:
  - package-ecosystem: "gomod"
    # Dependabot never updates go.work: bump its go directive by hand when a
    # module's goes past it.
    directories:
      - "/*/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 20
    cooldown:
      default-days: 3
      exclude:
        - "github.com/synadia-io/orbit.go/*"
    # Without group-by, groups apply per module.
    groups:
      orbit:
        patterns:
          - "github.com/synadia-io/orbit.go/*"
      dependencies:
        patterns:
          - "*"
